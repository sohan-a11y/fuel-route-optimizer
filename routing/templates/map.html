<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Route Optimizer | USA Truck Stop Planner</title>
    <meta name="description" content="Production-ready Django API & Interactive Map for Highway Route Fuel Stop Optimization">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        #map {
            flex: 1;
            height: 100vh;
            background: #1e293b;
            z-index: 1;
        }

        .sidebar {
            width: 440px;
            max-width: 100vw;
            height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #60a5fa, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .controls {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .presets {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
        }

        .metric-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-value.highlight {
            color: var(--success);
        }

        .stops-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stop-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            position: relative;
            transition: all 0.2s;
            cursor: pointer;
        }

        .stop-card:hover {
            border-color: var(--accent);
            transform: translateX(3px);
        }

        .stop-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .stop-num {
            display: inline-block;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            border-radius: 50%;
            margin-right: 6px;
        }

        .stop-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
            max-width: 260px;
        }

        .stop-location {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stop-details {
            display: flex;
            gap: 12px;
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            color: #cbd5e1;
        }

        .stop-details span strong {
            color: white;
        }

        .note-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #93c5fd;
            margin-bottom: 16px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Leaflet Dark Theme Overrides */
        .leaflet-container {
            background: #0f172a;
        }
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <h1><span>⛽</span> Fuel Route Optimizer</h1>
            <p>Production Django API with 500-Mile Cost Optimization</p>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>Start Location (USA)</label>
                <input type="text" id="start-input" value="New York, NY" placeholder="City, State or Lat, Lon">
            </div>
            <div class="input-group">
                <label>Finish Location (USA)</label>
                <input type="text" id="finish-input" value="Los Angeles, CA" placeholder="City, State or Lat, Lon">
            </div>

            <div class="presets">
                <span class="preset-btn" onclick="setPreset('New York, NY', 'Los Angeles, CA')">NY &rarr; LA</span>
                <span class="preset-btn" onclick="setPreset('Austin, TX', 'Seattle, WA')">Austin &rarr; Seattle</span>
                <span class="preset-btn" onclick="setPreset('Chicago, IL', 'Miami, FL')">Chicago &rarr; Miami</span>
                <span class="preset-btn" onclick="setPreset('Austin, TX', 'Dallas, TX')">Austin &rarr; Dallas (&lt;500mi)</span>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="fetchOptimizedRoute()">
                <span id="btn-text">Optimize Fuel Stops</span>
            </button>
        </div>

        <div class="results" id="results-panel">
            <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
                Click <strong>Optimize Fuel Stops</strong> to calculate route geometry and find the cheapest refueling locations along the highway.
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map
        const map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let routeLayer = null;
        let markersLayer = L.layerGroup().addTo(map);

        function setPreset(start, finish) {
            document.getElementById('start-input').value = start;
            document.getElementById('finish-input').value = finish;
            fetchOptimizedRoute();
        }

        async function fetchOptimizedRoute() {
            const start = document.getElementById('start-input').value.trim();
            const finish = document.getElementById('finish-input').value.trim();
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const resultsPanel = document.getElementById('results-panel');

            if (!start || !finish) {
                alert("Please enter both start and finish locations.");
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Routing & Optimizing...';

            try {
                const response = await fetch('/api/route/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start, finish })
                });

                const data = await response.json();

                if (!response.ok || data.status === 'error') {
                    throw new Error(data.message || JSON.stringify(data.errors) || "Failed to optimize route.");
                }

                renderResults(data);
                renderMap(data);
            } catch (err) {
                resultsPanel.innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 14px; color: #fca5a5;">
                        <strong>Error:</strong> ${err.message}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btnText.innerHTML = 'Optimize Fuel Stops';
            }
        }

        function renderResults(data) {
            const panel = document.getElementById('results-panel');
            let html = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-title">Total Distance</div>
                        <div class="metric-value">${data.total_distance_miles.toLocaleString()} mi</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Total Fuel Cost</div>
                        <div class="metric-value highlight">$${data.total_fuel_cost.toFixed(2)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Fuel Consumed</div>
                        <div class="metric-value">${data.total_gallons_consumed} gal</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Fuel Stops</div>
                        <div class="metric-value">${data.fuel_stops_count}</div>
                    </div>
                </div>
            `;

            if (data.note) {
                html += `<div class="note-box">${data.note}</div>`;
            }

            if (data.fuel_stops && data.fuel_stops.length > 0) {
                html += `<h3 style="font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.05em;">Optimal Refueling Stops (${data.fuel_stops.length})</h3>`;
                html += '<div class="stops-list">';
                data.fuel_stops.forEach(stop => {
                    html += `
                        <div class="stop-card" onclick="zoomToStop(${stop.coordinates.latitude}, ${stop.coordinates.longitude})">
                            <span class="stop-badge">$${stop.retail_price_per_gallon.toFixed(3)}/gal</span>
                            <div class="stop-name"><span class="stop-num">${stop.stop_number}</span> ${stop.truckstop_name}</div>
                            <div class="stop-location">${stop.address ? stop.address + ', ' : ''}${stop.city}, ${stop.state}</div>
                            <div class="stop-details">
                                <span>Mile: <strong>${stop.mile_marker}</strong></span>
                                <span>Refuel: <strong>${stop.gallons_refueled} gal</strong></span>
                                <span>Cost: <strong style="color: #10b981;">$${stop.cost_at_stop.toFixed(2)}</strong></span>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            panel.innerHTML = html;
        }

        function renderMap(data) {
            markersLayer.clearLayers();
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            // Draw Route Polyline
            routeLayer = L.geoJSON(data.route_geometry, {
                style: {
                    color: '#3b82f6',
                    weight: 5,
                    opacity: 0.85
                }
            }).addTo(map);

            map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

            // Add Start and Finish markers
            const coords = data.route_geometry.coordinates;
            const startCoord = [coords[0][1], coords[0][0]];
            const finishCoord = [coords[coords.length - 1][1], coords[coords.length - 1][0]];

            L.circleMarker(startCoord, {
                radius: 8,
                fillColor: '#10b981',
                color: '#fff',
                weight: 2,
                fillOpacity: 1
            }).bindPopup(`<b>Origin:</b> ${data.start_location}`).addTo(markersLayer);

            L.circleMarker(finishCoord, {
                radius: 8,
                fillColor: '#ef4444',
                color: '#fff',
                weight: 2,
                fillOpacity: 1
            }).bindPopup(`<b>Destination:</b> ${data.finish_location}`).addTo(markersLayer);

            // Add Fuel Stop markers
            if (data.fuel_stops) {
                data.fuel_stops.forEach(s => {
                    const stopLatLng = [s.coordinates.latitude, s.coordinates.longitude];
                    const marker = L.circleMarker(stopLatLng, {
                        radius: 7,
                        fillColor: '#f59e0b',
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 1
                    }).addTo(markersLayer);

                    marker.bindPopup(`
                        <div style="font-size: 13px;">
                            <strong style="color: #60a5fa;">Stop #${s.stop_number}: ${s.truckstop_name}</strong><br>
                            ${s.city}, ${s.state}<br>
                            <hr style="margin: 6px 0; border: none; border-top: 1px solid #475569;">
                            <b>Price:</b> $${s.retail_price_per_gallon.toFixed(3)}/gal<br>
                            <b>Gallons:</b> ${s.gallons_refueled} gal<br>
                            <b>Cost:</b> $${s.cost_at_stop.toFixed(2)}<br>
                            <b>Route Mile:</b> ${s.mile_marker} mi
                        </div>
                    `);
                });
            }
        }

        function zoomToStop(lat, lon) {
            map.flyTo([lat, lon], 12, { duration: 1.2 });
        }

        // Run default route on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchOptimizedRoute();
        });
    </script>
</body>
</html>
