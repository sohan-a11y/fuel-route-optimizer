<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Route Optimizer | Live Interactive Demo</title>
    <meta name="description" content="Live demonstration of the Fuel Route Optimization Algorithm for US road trips">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.90);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        #map {
            flex: 1;
            height: 100vh;
            background: #1e293b;
            z-index: 1;
        }

        .sidebar {
            width: 480px;
            max-width: 100vw;
            height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6);
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #60a5fa, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .controls {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            overflow-y: auto;
            max-height: 48vh;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 9px 12px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .presets {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .results {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .metric-title {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-value.highlight {
            color: var(--success);
        }

        /* Strategy Comparison */
        .comparison-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 14px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 6px;
        }

        .comparison-table th {
            text-align: left;
            color: var(--text-muted);
            padding: 4px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .comparison-table td {
            padding: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        .comparison-table tr.active-strat {
            background: rgba(59, 130, 246, 0.2);
            font-weight: 700;
        }

        .comparison-table tr:hover:not(.active-strat) {
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        /* Environmental Impact Banner */
        .esg-banner {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .esg-banner strong {
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Stops List */
        .stops-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stop-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stop-card:hover {
            border-color: var(--accent);
            transform: translateX(2px);
        }

        .stop-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .stop-num {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            border-radius: 50%;
            margin-right: 6px;
        }

        .stop-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
            max-width: 280px;
        }

        .stop-location {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stop-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11px;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
            color: #cbd5e1;
        }

        .hos-alert {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 5px;
            padding: 4px 8px;
            margin-top: 6px;
            font-size: 10.5px;
            color: #fcd34d;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .leaflet-container {
            background: #0f172a;
        }
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <h1><span>⛽</span> Fuel Route Optimizer</h1>
            <p>Highway Corridor Cost Optimization &bull; 1 OSRM Call</p>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>Start Location</label>
                <input type="text" id="start-input" value="New York, NY" placeholder="City, State">
            </div>
            <div class="input-group">
                <label>Finish Location</label>
                <input type="text" id="finish-input" value="Los Angeles, CA" placeholder="City, State">
            </div>

            <div class="input-group">
                <label>Vehicle Profile</label>
                <select id="vehicle-select" onchange="onVehicleChange()">
                    <option value="truck">🚛 Commercial Truck (500 mi range &bull; 10 MPG &bull; 50 gal tank)</option>
                    <option value="car">🚗 Passenger Car (420 mi range &bull; 30 MPG &bull; 14 gal tank)</option>
                    <option value="suv">🚙 SUV / Pickup (440 mi range &bull; 20 MPG &bull; 22 gal tank)</option>
                    <option value="bike">🏍️ Motorcycle / Bike (200 mi range &bull; 45 MPG &bull; 4.5 gal tank)</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Strategy</label>
                    <select id="strategy-select" onchange="runOptimization()">
                        <option value="lowest_cost">💰 Lowest Cost</option>
                        <option value="minimum_stops">⏱️ Min Stops</option>
                        <option value="balanced">⚖️ Balanced</option>
                        <option value="conservative">🛡️ Safety Reserve</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Starting Fuel</label>
                    <select id="fuel-select" onchange="runOptimization()">
                        <option value="100">Full Tank (100%)</option>
                        <option value="75">3/4 Tank (75%)</option>
                        <option value="50">Half Tank (50%)</option>
                        <option value="25">Quarter Tank (25%)</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Fuel Grade</label>
                    <select id="grade-select" onchange="runOptimization()">
                        <option value="diesel">🛢️ Diesel (1.00x)</option>
                        <option value="regular">⛽ Regular 87 (0.92x)</option>
                        <option value="premium">⚡ Premium 93 (1.08x)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Max Detour</label>
                    <select id="detour-select" onchange="runOptimization()">
                        <option value="3.0">3.0 miles</option>
                        <option value="5.0" selected>5.0 miles</option>
                        <option value="10.0">10.0 miles</option>
                    </select>
                </div>
            </div>

            <div class="presets">
                <span class="preset-btn" onclick="setPreset('New York, NY', 'Los Angeles, CA')">NY &rarr; LA</span>
                <span class="preset-btn" onclick="setPreset('Austin, TX', 'Seattle, WA')">Austin &rarr; Seattle</span>
                <span class="preset-btn" onclick="setPreset('Chicago, IL', 'Miami, FL')">Chicago &rarr; Miami</span>
                <span class="preset-btn" onclick="setPreset('Austin, TX', 'Dallas, TX')">Austin &rarr; Dallas (&lt;500mi)</span>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="runOptimization()">
                <span id="btn-text">Optimize Fuel Stops</span>
            </button>

            <div class="action-bar" id="action-bar" style="display: none;">
                <button class="action-btn" onclick="downloadClientGPX()">📥 Export GPX</button>
                <button class="action-btn" onclick="copyClientJSON()">📋 Copy JSON</button>
                <button class="action-btn" onclick="window.print()">🖨️ Print Route</button>
            </div>
        </div>

        <div class="results" id="results-panel">
            <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
                Loading truck stops dataset...
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Pre-cached Coordinates for Major US Cities
        const CITY_CACHE = {
            "new york, ny": [40.7128, -74.0060],
            "los angeles, ca": [34.0522, -118.2437],
            "chicago, il": [41.8781, -87.6298],
            "houston, tx": [29.7604, -95.3698],
            "phoenix, az": [33.4484, -112.0740],
            "philadelphia, pa": [39.9526, -75.1652],
            "san antonio, tx": [29.4241, -98.4936],
            "san diego, ca": [32.7157, -117.1611],
            "dallas, tx": [32.7767, -96.7970],
            "austin, tx": [30.2672, -97.7431],
            "san jose, ca": [37.3382, -121.8863],
            "san francisco, ca": [37.7749, -122.4194],
            "seattle, wa": [47.6062, -122.3321],
            "denver, co": [39.7392, -104.9903],
            "boston, ma": [42.3601, -71.0589],
            "miami, fl": [25.7617, -80.1918],
            "atlanta, ga": [33.7490, -84.3880],
            "las vegas, nv": [36.1699, -115.1398]
        };

        const map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        let routeLayer = null;
        let markersLayer = L.layerGroup().addTo(map);
        let allStations = [];
        let latestResult = null;
        let currentRouteCoords = null;

        // Load stations.json
        fetch('stations.json')
            .then(res => res.json())
            .then(data => {
                allStations = data;
                document.getElementById('results-panel').innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
                        Ready! Loaded <strong>${allStations.length.toLocaleString()}</strong> US fuel stations. Click <strong>Optimize Fuel Stops</strong>.
                    </div>
                `;
                runOptimization();
            })
            .catch(err => {
                document.getElementById('results-panel').innerHTML = `<div style="color: red; padding: 20px;">Failed to load stations dataset: ${err.message}</div>`;
            });

        function onVehicleChange() {
            const v = document.getElementById('vehicle-select').value;
            const gradeSelect = document.getElementById('grade-select');
            if (v === 'truck') {
                gradeSelect.value = 'diesel';
            } else {
                gradeSelect.value = 'regular';
            }
            runOptimization();
        }

        function setPreset(start, finish) {
            document.getElementById('start-input').value = start;
            document.getElementById('finish-input').value = finish;
            runOptimization();
        }

        function switchClientStrategy(strat) {
            document.getElementById('strategy-select').value = strat;
            runOptimization();
        }

        async function geocode(text) {
            const clean = text.trim().toLowerCase();
            if (CITY_CACHE[clean]) return { lat: CITY_CACHE[clean][0], lon: CITY_CACHE[clean][1], label: text };

            const parts = clean.split(',').map(s => parseFloat(s.trim()));
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                return { lat: parts[0], lon: parts[1], label: `${parts[0].toFixed(3)}, ${parts[1].toFixed(3)}` };
            }

            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(text)}&format=json&countrycodes=us&limit=1`;
            const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
            const data = await r.json();
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
            }
            throw new Error(`Location '${text}' could not be found.`);
        }

        async function runOptimization() {
            if (allStations.length === 0) return;
            const startStr = document.getElementById('start-input').value.trim();
            const finishStr = document.getElementById('finish-input').value.trim();
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Routing & Optimizing...';

            try {
                const start = await geocode(startStr);
                const finish = await geocode(finishStr);

                // Exactly 1 OSRM public API call
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${finish.lon},${finish.lat}?overview=full&geometries=geojson`;
                const osrmRes = await fetch(osrmUrl);
                const osrmData = await osrmRes.json();

                if (!osrmData.routes || osrmData.routes.length === 0) {
                    throw new Error("No driving route found between these locations.");
                }

                const route = osrmData.routes[0];
                const totalMiles = route.distance / 1609.344;
                const drivingHours = route.duration / 3600;
                const coords = route.geometry.coordinates;
                currentRouteCoords = coords;

                const result = calculateFuelStops(coords, totalMiles, drivingHours, start.label, finish.label);
                latestResult = result;
                document.getElementById('action-bar').style.display = 'flex';
                renderResults(result);
                renderMap(route.geometry, result, start, finish);

            } catch (err) {
                document.getElementById('results-panel').innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 14px; color: #fca5a5;">
                        <strong>Error:</strong> ${err.message}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btnText.innerHTML = 'Optimize Fuel Stops';
            }
        }

        function calculateFuelStops(coords, totalMiles, drivingHours, startLabel, finishLabel) {
            let cumDists = [0];
            for (let i = 1; i < coords.length; i++) {
                const d = haversine(coords[i-1][1], coords[i-1][0], coords[i][1], coords[i][0]);
                cumDists.push(cumDists[i-1] + d);
            }
            const actualTotalMiles = cumDists[cumDists.length - 1];

            let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
            coords.forEach(c => {
                if (c[0] < minLon) minLon = c[0];
                if (c[0] > maxLon) maxLon = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            });

            const buf = 0.25;
            let candidates = [];

            const step = Math.max(1, Math.floor(coords.length / 500));
            const sampledCoords = [];
            const sampledDists = [];
            for (let i = 0; i < coords.length; i += step) {
                sampledCoords.push(coords[i]);
                sampledDists.push(cumDists[i]);
            }

            const gradeSelect = document.getElementById('grade-select').value;
            const gradeMultipliers = { "diesel": 1.0, "regular": 0.92, "premium": 1.08 };
            const gradeMul = gradeMultipliers[gradeSelect] || 1.0;

            const maxDetour = parseFloat(document.getElementById('detour-select').value) || 5.0;

            allStations.forEach(st => {
                if (st.longitude >= minLon - buf && st.longitude <= maxLon + buf &&
                    st.latitude >= minLat - buf && st.latitude <= maxLat + buf) {
                    
                    let minDist = Infinity;
                    let bestMile = 0;
                    for (let i = 0; i < sampledCoords.length; i++) {
                        const d = haversine(st.latitude, st.longitude, sampledCoords[i][1], sampledCoords[i][0]);
                        if (d < minDist) {
                            minDist = d;
                            bestMile = sampledDists[i];
                        }
                    }

                    if (minDist <= maxDetour && bestMile > 5.0 && bestMile < actualTotalMiles - 5.0) {
                        const adjPrice = Math.round(st.retail_price * gradeMul * 1000) / 1000;
                        candidates.push({
                            ...st,
                            mile: bestMile,
                            price: adjPrice,
                            detour: Math.round(minDist * 10) / 10
                        });
                    }
                }
            });

            candidates.sort((a, b) => a.mile - b.mile);

            // Deduplicate stations within 2 miles
            let filtered = [];
            candidates.forEach(c => {
                if (filtered.length === 0 || c.mile - filtered[filtered.length - 1].mile > 2.0) {
                    filtered.push(c);
                } else if (c.price < filtered[filtered.length - 1].price) {
                    filtered[filtered.length - 1] = c;
                }
            });

            // Vehicle Specifications
            const vehicleProfiles = {
                "truck": { name: "Commercial Truck", maxRange: 500.0, mpg: 10.0, capacity: 50.0, icon: "🚛", stopMins: 15 },
                "car": { name: "Passenger Car", maxRange: 420.0, mpg: 30.0, capacity: 14.0, icon: "🚗", stopMins: 8 },
                "suv": { name: "SUV / Pickup", maxRange: 440.0, mpg: 20.0, capacity: 22.0, icon: "🚙", stopMins: 8 },
                "bike": { name: "Motorcycle / Bike", maxRange: 200.0, mpg: 45.0, capacity: 4.5, icon: "🏍️", stopMins: 5 }
            };
            const vType = document.getElementById('vehicle-select').value;
            const spec = vehicleProfiles[vType] || vehicleProfiles['truck'];
            const maxRange = spec.maxRange;
            const mpg = spec.mpg;
            const capacity = spec.capacity;
            const stopMins = spec.stopMins;

            const initPct = parseFloat(document.getElementById('fuel-select').value) / 100.0;
            const initRange = maxRange * initPct;

            const activeStrat = document.getElementById('strategy-select').value;

            // Strategy Solver Function
            function solveStrategy(stratName) {
                let sStops = [];
                let sCost = 0;
                let cMile = 0;
                let tMiles = initRange;
                let lastHosBreak = 0;
                const avgSpeed = (actualTotalMiles / drivingHours) || 60;

                let minFrac = 0.45;
                let reserve = maxRange * 0.08;
                if (stratName === 'minimum_stops') { minFrac = 0.75; reserve = 15; }
                else if (stratName === 'balanced') { minFrac = 0.55; reserve = 20; }
                else if (stratName === 'conservative') { minFrac = 0.40; reserve = maxRange * 0.18; }

                if (actualTotalMiles > initRange) {
                    while (cMile + tMiles < actualTotalMiles) {
                        let safeMax = cMile + tMiles - reserve;
                        let reachable = filtered.filter(s => s.mile > cMile && s.mile <= safeMax);
                        if (reachable.length === 0) reachable = filtered.filter(s => s.mile > cMile && s.mile <= cMile + tMiles);
                        if (reachable.length === 0) break;

                        let window = reachable.filter(s => s.mile >= cMile + (maxRange * minFrac));
                        if (window.length === 0) window = reachable;

                        let best = window[0];
                        if (stratName === 'minimum_stops') {
                            let minP = Math.min(...window.map(s => s.price));
                            let acc = window.filter(s => s.price <= minP * 1.08);
                            best = acc.reduce((max, s) => s.mile > max.mile ? s : max, acc[0]);
                        } else if (stratName === 'balanced') {
                            best = window.reduce((bestSt, s) => {
                                let score = (s.price * 100) - ((s.mile - cMile) / maxRange * 20);
                                let bestScore = (bestSt.price * 100) - ((bestSt.mile - cMile) / maxRange * 20);
                                return score < bestScore ? s : bestSt;
                            }, window[0]);
                        } else {
                            best = window.reduce((min, s) => s.price < min.price ? s : min, window[0]);
                        }

                        let legDist = best.mile - cMile;
                        let gallons = Math.round(Math.min(capacity, legDist / mpg) * 10) / 10;
                        let cost = Math.round(gallons * best.price * 100) / 100;
                        sCost += cost;

                        let arrivalPct = Math.round(Math.max(0, (capacity - gallons) / capacity) * 100);
                        let arrHours = Math.round((best.mile / avgSpeed) * 10) / 10;
                        let hosBreak = false;
                        if (arrHours - lastHosBreak >= 7.5) {
                            hosBreak = true;
                            lastHosBreak = arrHours;
                        }

                        sStops.push({
                            stop_number: sStops.length + 1,
                            name: best.name,
                            city: best.city,
                            state: best.state,
                            price: best.price,
                            mile: Math.round(best.mile * 10) / 10,
                            leg_dist: Math.round(legDist * 10) / 10,
                            detour: best.detour,
                            gallons: gallons,
                            cost: cost,
                            arrivalPct: arrivalPct,
                            arrHours: arrHours,
                            hosBreak: hosBreak,
                            lat: best.latitude,
                            lon: best.longitude
                        });

                        cMile = best.mile;
                        tMiles = maxRange;
                    }

                    if (sStops.length > 0) {
                        let finalDist = actualTotalMiles - cMile;
                        let finalGal = Math.round((finalDist / mpg) * 10) / 10;
                        let finalCost = Math.round(finalGal * sStops[sStops.length - 1].price * 100) / 100;
                        sCost += finalCost;
                        sStops[sStops.length - 1].final_leg = {
                            dist: Math.round(finalDist * 10) / 10,
                            gallons: finalGal,
                            cost: finalCost
                        };
                    }
                } else {
                    let refPrice = filtered.length > 0 ? Math.min(...filtered.map(s => s.price)) : 3.25 * gradeMul;
                    sCost = (actualTotalMiles / mpg) * refPrice;
                }

                return { stops: sStops, totalCost: Math.round(sCost * 100) / 100 };
            }

            // Run active strategy
            const activeResult = solveStrategy(activeStrat);

            // Compute comparison matrix across all 4 strategies
            const matrix = ['lowest_cost', 'minimum_stops', 'balanced', 'conservative'].map(st => {
                const res = solveStrategy(st);
                const tripH = Math.round((drivingHours + (res.stops.length * stopMins / 60)) * 10) / 10;
                return {
                    strategy: st,
                    name: st.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase()),
                    stopsCount: res.stops.length,
                    totalCost: res.totalCost,
                    tripHours: tripH
                };
            });
            const minC = Math.min(...matrix.map(m => m.totalCost));
            matrix.forEach(m => { m.diff = Math.round((m.totalCost - minC) * 100) / 100; });

            // Environmental ESG
            const co2Factor = gradeSelect === 'diesel' ? 10.18 : 8.887;
            const totalGal = Math.round((actualTotalMiles / mpg) * 10) / 10;
            const carbonKg = Math.round(totalGal * co2Factor * 10) / 10;
            const carbonLbs = Math.round(carbonKg * 2.20462 * 10) / 10;
            const trees = Math.round((carbonKg / 21.77) * 10) / 10;

            return {
                start: startLabel,
                finish: finishLabel,
                vehicle: spec,
                strategy: activeStrat,
                totalMiles: Math.round(actualTotalMiles * 10) / 10,
                drivingHours: Math.round(drivingHours * 10) / 10,
                totalGallons: totalGal,
                totalCost: activeResult.totalCost,
                stops: activeResult.stops,
                matrix: matrix,
                carbonKg: carbonKg,
                carbonLbs: carbonLbs,
                trees: trees
            };
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function renderResults(data) {
            const panel = document.getElementById('results-panel');
            const v = data.vehicle;
            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 11px;">
                    <span><strong>${v.icon} ${v.name}</strong></span>
                    <span style="color: var(--text-muted);">Range: <strong>${v.maxRange}mi</strong> &bull; Tank: <strong>${v.capacity}gal</strong> &bull; <strong>${v.mpg} MPG</strong></span>
                </div>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-title">Total Distance</div>
                        <div class="metric-value">${data.totalMiles.toLocaleString()} mi</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Total Fuel Cost</div>
                        <div class="metric-value highlight">$${data.totalCost.toFixed(2)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Fuel Consumed</div>
                        <div class="metric-value">${data.totalGallons} gal</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Fuel Stops</div>
                        <div class="metric-value">${data.stops.length}</div>
                    </div>
                </div>
            `;

            // Comparison Matrix
            if (data.matrix) {
                html += `
                    <div class="comparison-card">
                        <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between;">
                            <span>Strategy Trade-Off Matrix</span>
                            <span style="font-size: 10px; color: var(--accent);">Click row to apply</span>
                        </div>
                        <table class="comparison-table">
                            <thead>
                                <tr>
                                    <th>Strategy</th>
                                    <th>Stops</th>
                                    <th>Trip Duration</th>
                                    <th>Total Cost</th>
                                    <th>Diff</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                data.matrix.forEach(m => {
                    const isActive = m.strategy === data.strategy;
                    const diffText = m.diff > 0 ? `+$${m.diff.toFixed(2)}` : 'Cheapest';
                    const diffColor = m.diff > 0 ? '#94a3b8' : '#10b981';
                    html += `
                        <tr class="${isActive ? 'active-strat' : ''}" onclick="switchClientStrategy('${m.strategy}')">
                            <td style="font-family: inherit;">${isActive ? '👉 ' : ''}<strong>${m.name}</strong></td>
                            <td>${m.stopsCount}</td>
                            <td>${m.tripHours}h</td>
                            <td>$${m.totalCost.toFixed(2)}</td>
                            <td style="color: ${diffColor};">${diffText}</td>
                        </tr>
                    `;
                });
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // Environmental ESG Banner
            html += `
                <div class="esg-banner">
                    <span>🌱 <strong>${data.carbonKg} kg</strong> (${data.carbonLbs} lbs) CO₂</span>
                    <span>🌲 Offset: <strong>${data.trees}</strong> trees/yr</span>
                </div>
            `;

            // Stops List
            if (data.stops.length > 0) {
                html += `<h3 style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.05em;">Optimal Refueling Stops (${data.stops.length})</h3>`;
                html += '<div class="stops-list">';
                data.stops.forEach(s => {
                    html += `
                        <div class="stop-card" onclick="zoomToStop(${s.lat}, ${s.lon})">
                            <span class="stop-badge">$${s.price.toFixed(3)}/gal</span>
                            <div class="stop-name"><span class="stop-num">${s.stop_number}</span> ${s.name}</div>
                            <div class="stop-location">${s.city}, ${s.state} &bull; ${s.detour} mi detour</div>
                            <div class="stop-details">
                                <span>Mile: <strong>${s.mile}</strong></span>
                                <span>Refuel: <strong>${s.gallons} gal</strong></span>
                                <span>Cost: <strong style="color: #10b981;">$${s.cost.toFixed(2)}</strong></span>
                                <span>Arrive Fuel: <strong>${s.arrivalPct}%</strong></span>
                            </div>
                    `;
                    if (s.hosBreak) {
                        html += `
                            <div class="hos-alert">
                                <span>☕</span>
                                <span><strong>30-Min DOT Rest Break:</strong> Cumulative driving reaches ~${s.arrHours}h. Recommended rest break matches this stop.</span>
                            </div>
                        `;
                    }
                    html += `</div>`;
                });
                html += '</div>';
            } else {
                html += `
                    <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 12px; font-size: 12px; color: #93c5fd;">
                        Trip distance of <strong>${data.totalMiles} miles</strong> is within the vehicle's departure range. No mid-route refueling stops required.
                    </div>
                `;
            }

            panel.innerHTML = html;
        }

        function renderMap(geometry, result, start, finish) {
            markersLayer.clearLayers();
            if (routeLayer) map.removeLayer(routeLayer);

            routeLayer = L.geoJSON(geometry, {
                style: { color: '#3b82f6', weight: 5, opacity: 0.85 }
            }).addTo(map);

            map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

            L.circleMarker([start.lat, start.lon], {
                radius: 8, fillColor: '#10b981', color: '#fff', weight: 2, fillOpacity: 1
            }).bindPopup(`<b>Origin:</b> ${start.label}`).addTo(markersLayer);

            L.circleMarker([finish.lat, finish.lon], {
                radius: 8, fillColor: '#ef4444', color: '#fff', weight: 2, fillOpacity: 1
            }).bindPopup(`<b>Destination:</b> ${finish.label}`).addTo(markersLayer);

            result.stops.forEach(s => {
                const marker = L.circleMarker([s.lat, s.lon], {
                    radius: 7, fillColor: '#f59e0b', color: '#ffffff', weight: 2, fillOpacity: 1
                }).addTo(markersLayer);

                let pop = `
                    <div style="font-size: 12px;">
                        <strong style="color: #60a5fa;">Stop #${s.stop_number}: ${s.name}</strong><br>
                        ${s.city}, ${s.state}<br>
                        <hr style="margin: 5px 0; border: none; border-top: 1px solid #475569;">
                        <b>Price:</b> $${s.price.toFixed(3)}/gal<br>
                        <b>Refuel:</b> ${s.gallons} gal<br>
                        <b>Cost:</b> $${s.cost.toFixed(2)}<br>
                        <b>Route Mile:</b> ${s.mile} mi
                `;
                if (s.hosBreak) pop += `<br><span style="color: #f59e0b; font-weight: bold;">☕ Recommended 30-min Rest Break</span>`;
                pop += `</div>`;
                marker.bindPopup(pop);
            });
        }

        function zoomToStop(lat, lon) {
            map.flyTo([lat, lon], 12, { duration: 1.2 });
        }

        function downloadClientGPX() {
            if (!latestResult || !currentRouteCoords) return;
            const startStr = document.getElementById('start-input').value.trim();
            const finishStr = document.getElementById('finish-input').value.trim();

            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<gpx version="1.1" creator="FuelRouteOptimizer" xmlns="http://www.topografix.com/GPX/1/1">\n`;
            xml += `  <metadata>\n    <name>Route from ${startStr} to ${finishStr}</name>\n`;
            xml += `    <desc>Total Distance: ${latestResult.totalMiles} mi, Fuel Cost: $${latestResult.totalCost}</desc>\n  </metadata>\n`;

            // Start & Finish waypoints
            xml += `  <wpt lat="${currentRouteCoords[0][1]}" lon="${currentRouteCoords[0][0]}"><name>Origin: ${startStr}</name><sym>Flag, Green</sym></wpt>\n`;
            xml += `  <wpt lat="${currentRouteCoords[currentRouteCoords.length-1][1]}" lon="${currentRouteCoords[currentRouteCoords.length-1][0]}"><name>Destination: ${finishStr}</name><sym>Flag, Red</sym></wpt>\n`;

            // Stops waypoints
            latestResult.stops.forEach(s => {
                xml += `  <wpt lat="${s.lat}" lon="${s.lon}"><name>Stop #${s.stop_number}: ${s.name}</name><desc>Price: $${s.price}/gal, Refuel: ${s.gallons} gal, Cost: $${s.cost}</desc><sym>Gas Station</sym></wpt>\n`;
            });

            // Track points
            xml += `  <trk>\n    <name>Optimized Driving Track</name>\n    <trkseg>\n`;
            currentRouteCoords.forEach(pt => {
                xml += `      <trkpt lat="${pt[1]}" lon="${pt[0]}"></trkpt>\n`;
            });
            xml += `    </trkseg>\n  </trk>\n</gpx>`;

            const blob = new Blob([xml], { type: "application/gpx+xml" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "optimized_route.gpx";
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyClientJSON() {
            if (!latestResult) return;
            navigator.clipboard.writeText(JSON.stringify(latestResult, null, 2)).then(() => {
                alert("Route JSON copied to clipboard!");
            });
        }
    </script>
